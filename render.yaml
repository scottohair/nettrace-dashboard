services:
  - type: web
    name: donation-mcp-broadcast
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./services/donation_mcp/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DONATION_REQUIRE_AUTH
        value: "1"
      - key: DONATION_BROADCAST_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: donation-mcp-postgres
          property: connectionString
databases:
  - name: donation-mcp-postgres
    databaseName: donation_mcp
    user: donation_mcp
    plan: free
