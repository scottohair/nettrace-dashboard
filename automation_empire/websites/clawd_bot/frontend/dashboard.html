<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - clawd.bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Dashboard() {
            const [agents, setAgents] = useState([]);
            const [stats, setStats] = useState({
                total_pnl: 0,
                active_agents: 0,
                win_rate: 0,
                sharpe: 0
            });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                loadDashboard();
                const interval = setInterval(loadDashboard, 5000);
                return () => clearInterval(interval);
            }, []);

            const loadDashboard = async () => {
                try {
                    const token = localStorage.getItem('token');

                    const [agentsRes, statsRes] = await Promise.all([
                        fetch('/api/dashboard/agents', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        }),
                        fetch('/api/stats')
                    ]);

                    const agentsData = await agentsRes.json();
                    const statsData = await statsRes.json();

                    setAgents(agentsData.agents || []);
                    setStats(statsData);
                    setLoading(false);
                } catch (error) {
                    console.error('Failed to load dashboard:', error);
                    setLoading(false);
                }
            };

            const startAgent = async (strategyId) => {
                const token = localStorage.getItem('token');

                try {
                    const res = await fetch('/api/agents/start', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ strategy_id: strategyId })
                    });

                    const data = await res.json();

                    if (data.success) {
                        alert('Agent started successfully!');
                        loadDashboard();
                    } else {
                        alert(data.error || 'Failed to start agent');
                    }
                } catch (error) {
                    alert('Error starting agent');
                }
            };

            const stopAgent = async (agentId) => {
                const token = localStorage.getItem('token');

                try {
                    const res = await fetch(`/api/agents/${agentId}/stop`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    const data = await res.json();

                    if (data.success) {
                        alert('Agent stopped');
                        loadDashboard();
                    }
                } catch (error) {
                    alert('Error stopping agent');
                }
            };

            if (loading) {
                return (
                    <div className="flex items-center justify-center h-screen">
                        <div className="text-2xl">Loading...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="bg-gray-800 border-b border-gray-700">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-8">
                                    <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                                        clawd.bot
                                    </h1>
                                    <nav className="flex space-x-4">
                                        <a href="/frontend/dashboard.html" className="text-blue-400 font-semibold">Dashboard</a>
                                        <a href="/frontend/marketplace.html" className="text-gray-400 hover:text-gray-200">Marketplace</a>
                                        <a href="/frontend/backtest.html" className="text-gray-400 hover:text-gray-200">Backtest</a>
                                    </nav>
                                </div>
                                <div className="text-sm text-gray-400">
                                    {agents.length} active agents
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Stats Cards */}
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <div className="text-gray-400 text-sm mb-2">Total P&L</div>
                                <div className="text-3xl font-bold text-green-400">
                                    ${stats.total_pnl?.toFixed(2) || '0.00'}
                                </div>
                            </div>
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <div className="text-gray-400 text-sm mb-2">Active Agents</div>
                                <div className="text-3xl font-bold text-blue-400">
                                    {stats.active_agents || 0}
                                </div>
                            </div>
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <div className="text-gray-400 text-sm mb-2">Win Rate</div>
                                <div className="text-3xl font-bold text-purple-400">
                                    {((stats.win_rate || 0) * 100).toFixed(1)}%
                                </div>
                            </div>
                            <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                                <div className="text-gray-400 text-sm mb-2">Sharpe Ratio</div>
                                <div className="text-3xl font-bold text-yellow-400">
                                    {(stats.sharpe || 0).toFixed(2)}
                                </div>
                            </div>
                        </div>

                        {/* Agents Table */}
                        <div className="bg-gray-800 rounded-lg border border-gray-700">
                            <div className="p-6 border-b border-gray-700">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xl font-bold">Your Agents</h2>
                                    <button
                                        onClick={() => window.location.href = '/frontend/marketplace.html'}
                                        className="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition"
                                    >
                                        + Add Agent
                                    </button>
                                </div>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead className="bg-gray-900">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Agent ID</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Strategy</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Status</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Trades</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Win Rate</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">P&L</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Sharpe</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-700">
                                        {agents.length === 0 ? (
                                            <tr>
                                                <td colSpan="8" className="px-6 py-12 text-center text-gray-400">
                                                    <div className="text-lg mb-2">No agents running</div>
                                                    <div className="text-sm">Visit the marketplace to deploy your first agent</div>
                                                </td>
                                            </tr>
                                        ) : (
                                            agents.map(agent => (
                                                <tr key={agent.agent_id} className="hover:bg-gray-750">
                                                    <td className="px-6 py-4 text-sm font-mono">{agent.agent_id.substring(0, 12)}...</td>
                                                    <td className="px-6 py-4 text-sm">{agent.strategy_id}</td>
                                                    <td className="px-6 py-4">
                                                        <span className={`px-2 py-1 rounded-full text-xs font-semibold ${
                                                            agent.status === 'running' ? 'bg-green-900 text-green-300' : 'bg-gray-700 text-gray-300'
                                                        }`}>
                                                            {agent.status}
                                                        </span>
                                                    </td>
                                                    <td className="px-6 py-4 text-sm">{agent.trades || 0}</td>
                                                    <td className="px-6 py-4 text-sm">{((agent.win_rate || 0) * 100).toFixed(1)}%</td>
                                                    <td className={`px-6 py-4 text-sm font-semibold ${
                                                        (agent.total_pnl || 0) >= 0 ? 'text-green-400' : 'text-red-400'
                                                    }`}>
                                                        ${(agent.total_pnl || 0).toFixed(2)}
                                                    </td>
                                                    <td className="px-6 py-4 text-sm">{(agent.sharpe_ratio || 0).toFixed(2)}</td>
                                                    <td className="px-6 py-4">
                                                        {agent.status === 'running' && (
                                                            <button
                                                                onClick={() => stopAgent(agent.agent_id)}
                                                                className="px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-xs font-semibold transition"
                                                            >
                                                                Stop
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Performance Chart */}
                        <div className="mt-8 bg-gray-800 rounded-lg border border-gray-700 p-6">
                            <h2 className="text-xl font-bold mb-4">Portfolio Performance</h2>
                            <div className="h-64 flex items-center justify-center text-gray-400">
                                Chart placeholder - integrate Chart.js for live P&L tracking
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
