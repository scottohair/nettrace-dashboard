<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - clawd.bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Marketplace() {
            const [strategies, setStrategies] = useState([]);
            const [category, setCategory] = useState('all');
            const [sortBy, setSortBy] = useState('rating');
            const [loading, setLoading] = useState(true);

            const categories = [
                'all', 'momentum', 'mean_reversion', 'arbitrage',
                'sentiment', 'ml', 'volatility'
            ];

            useEffect(() => {
                loadStrategies();
            }, [category, sortBy]);

            const loadStrategies = async () => {
                setLoading(true);
                try {
                    const params = new URLSearchParams();
                    if (category !== 'all') params.append('category', category);
                    params.append('sort', sortBy);

                    const res = await fetch(`/api/marketplace/strategies?${params}`);
                    const data = await res.json();

                    setStrategies(data.strategies || []);
                } catch (error) {
                    console.error('Failed to load strategies:', error);
                }
                setLoading(false);
            };

            const deployStrategy = async (strategyId) => {
                const token = localStorage.getItem('token');

                if (!token) {
                    alert('Please login first');
                    return;
                }

                try {
                    const res = await fetch('/api/agents/start', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ strategy_id: strategyId })
                    });

                    const data = await res.json();

                    if (data.success) {
                        alert('Strategy deployed successfully!');
                        window.location.href = '/frontend/dashboard.html';
                    } else {
                        alert(data.error || 'Failed to deploy strategy');
                    }
                } catch (error) {
                    alert('Error deploying strategy');
                }
            };

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="bg-gray-800 border-b border-gray-700">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-8">
                                    <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                                        clawd.bot
                                    </h1>
                                    <nav className="flex space-x-4">
                                        <a href="/frontend/dashboard.html" className="text-gray-400 hover:text-gray-200">Dashboard</a>
                                        <a href="/frontend/marketplace.html" className="text-blue-400 font-semibold">Marketplace</a>
                                        <a href="/frontend/backtest.html" className="text-gray-400 hover:text-gray-200">Backtest</a>
                                    </nav>
                                </div>
                                <button
                                    onClick={() => window.location.href = '/frontend/dashboard.html'}
                                    className="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition"
                                >
                                    My Agents
                                </button>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-8">
                        {/* Header */}
                        <div className="mb-8">
                            <h2 className="text-3xl font-bold mb-2">Strategy Marketplace</h2>
                            <p className="text-gray-400">Deploy proven trading strategies in one click</p>
                        </div>

                        {/* Filters */}
                        <div className="bg-gray-800 rounded-lg p-6 mb-8 border border-gray-700">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-400 mb-2">Category</label>
                                    <select
                                        value={category}
                                        onChange={(e) => setCategory(e.target.value)}
                                        className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        {categories.map(cat => (
                                            <option key={cat} value={cat}>
                                                {cat.charAt(0).toUpperCase() + cat.slice(1).replace('_', ' ')}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-400 mb-2">Sort By</label>
                                    <select
                                        value={sortBy}
                                        onChange={(e) => setSortBy(e.target.value)}
                                        className="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="rating">Highest Rated</option>
                                        <option value="downloads">Most Popular</option>
                                        <option value="newest">Newest</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Strategies Grid */}
                        {loading ? (
                            <div className="text-center py-12">
                                <div className="text-xl">Loading strategies...</div>
                            </div>
                        ) : strategies.length === 0 ? (
                            <div className="bg-gray-800 rounded-lg p-12 text-center border border-gray-700">
                                <div className="text-xl mb-2">No strategies found</div>
                                <div className="text-gray-400">Try a different category or filter</div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {strategies.map(strategy => (
                                    <div key={strategy.strategy_id} className="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden hover:border-blue-500 transition">
                                        <div className="p-6">
                                            <div className="flex items-start justify-between mb-4">
                                                <div>
                                                    <h3 className="text-lg font-bold mb-1">{strategy.name}</h3>
                                                    <span className="px-2 py-1 bg-gray-700 rounded text-xs text-gray-300">
                                                        {strategy.category}
                                                    </span>
                                                </div>
                                                <div className="flex items-center text-yellow-400">
                                                    <span className="text-sm font-semibold">★ {strategy.rating?.toFixed(1) || '0.0'}</span>
                                                    <span className="text-xs text-gray-400 ml-1">({strategy.reviews_count || 0})</span>
                                                </div>
                                            </div>

                                            <p className="text-sm text-gray-400 mb-4 line-clamp-2">
                                                {strategy.description || 'No description available'}
                                            </p>

                                            {/* Performance Metrics */}
                                            <div className="grid grid-cols-2 gap-3 mb-4">
                                                <div className="bg-gray-900 rounded p-3">
                                                    <div className="text-xs text-gray-400 mb-1">Sharpe</div>
                                                    <div className="text-lg font-bold text-blue-400">
                                                        {strategy.backtest_sharpe?.toFixed(2) || 'N/A'}
                                                    </div>
                                                </div>
                                                <div className="bg-gray-900 rounded p-3">
                                                    <div className="text-xs text-gray-400 mb-1">Win Rate</div>
                                                    <div className="text-lg font-bold text-green-400">
                                                        {strategy.backtest_win_rate ? `${(strategy.backtest_win_rate * 100).toFixed(1)}%` : 'N/A'}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Live Performance */}
                                            {strategy.live_trades > 0 && (
                                                <div className="bg-green-900/20 border border-green-700 rounded p-3 mb-4">
                                                    <div className="text-xs text-green-400 mb-1">✓ Live Verified</div>
                                                    <div className="text-xs text-gray-300">
                                                        {strategy.live_trades} trades, {(strategy.live_win_rate * 100).toFixed(1)}% WR
                                                    </div>
                                                </div>
                                            )}

                                            <div className="flex items-center justify-between">
                                                <div className="text-sm text-gray-400">
                                                    {strategy.downloads || 0} deploys
                                                </div>
                                                <button
                                                    onClick={() => deployStrategy(strategy.strategy_id)}
                                                    className="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition"
                                                >
                                                    {strategy.price > 0 ? `$${strategy.price}` : 'Deploy'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Upload Strategy CTA */}
                        <div className="mt-12 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg p-8 text-center">
                            <h3 className="text-2xl font-bold mb-2">Have a winning strategy?</h3>
                            <p className="text-blue-100 mb-4">Upload your strategy and earn 70% revenue share</p>
                            <button className="px-6 py-3 bg-white text-blue-600 font-bold rounded-lg hover:bg-blue-50 transition">
                                Upload Strategy
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Marketplace />, document.getElementById('root'));
    </script>
</body>
</html>
